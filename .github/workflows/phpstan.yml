name: Code Analysis with PHPStan
on: [push]
jobs:
  phpstan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2
    - name: Guard - committed vendor autoloader must be production (--no-dev)
      run: |
        if grep -q "phpstan/phpstan/bootstrap.php" vendor/composer/autoload_files.php vendor/composer/autoload_static.php 2>/dev/null; then
          echo "::error::Committed vendor autoloader references a dev dependency (phpstan). Run 'composer autoload-prod' before committing vendor."
          exit 1
        fi
    - name: Check if vendor directory exists and remove it
      run: |
        if [ -d "vendor" ]; then
          echo "Removing existing vendor directory"
          rm -rf vendor
        fi
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
    - name: Create empty node_modules directory
      run: |
        mkdir -p node_modules
        echo "Created empty node_modules directory"
    - name: Install Composer Dependencies
      run: |
        composer install --prefer-dist --no-interaction
        composer dump-autoload
    - name: Run PHPStan
      run: vendor/bin/phpstan analyse
